name: Build Windows EXE

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --add-data "ui.html;." receipt_server.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: kebbet-receipt
          path: dist/receipt_server.exe
