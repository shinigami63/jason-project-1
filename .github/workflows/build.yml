name: Build Windows EXE

"on":
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask pyinstaller pywebview pillow python-escpos uharfbuzz freetype-py pywin32

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --add-data "ui.html;." --add-data "extract.py;." --add-data "fonts/Cairo.ttf;fonts" --collect-data escpos --name "KebzetZamen" receipt_server.py

      # Files the app loads at runtime (the UI, the Arabic font, python-escpos's
      # printer capabilities table) are data, not imports, so PyInstaller only
      # bundles them if it's told to -- and when one is missed the .exe builds
      # fine and then fails on the till instead. Fail the build here instead.
      - name: Verify runtime resources are bundled
        run: |
          $toc = Get-Content build/KebzetZamen/PKG-00.toc -Raw
          foreach ($f in @('ui.html', 'extract.py', 'Cairo.ttf', 'capabilities.json')) {
            if ($toc -notmatch [regex]::Escape($f)) { throw "not bundled into the exe: $f" }
            Write-Host "bundled: $f"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KebzetZamen-Windows
          path: dist/KebzetZamen.exe

      # Publish the freshly built .exe to a rolling "latest" release so there
      # is one permanent, login-free download link that always points at the
      # newest build:
      #   https://github.com/<owner>/<repo>/releases/latest/download/KebzetZamen.exe
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: dist/KebzetZamen.exe
