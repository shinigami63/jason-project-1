name: Build Windows EXE

"on":
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask pyinstaller pywebview pillow python-escpos uharfbuzz freetype-py pywin32

      # --onedir, not --onefile: a single-file exe unpacks a whole Python
      # runtime into a temp folder on every launch, which is what a dropper
      # does too, so unsigned onefile builds get flagged by Chrome's download
      # protection and by Defender's heuristics. A onedir build ships the same
      # files laid out on disk, which trips far fewer of those, and starts
      # faster because nothing is unpacked at launch.
      # The build number is what the app's "Check for updates" compares
      # against: it reads this version out of the bundle, and the release is
      # named with the same string. github.run_number only ever goes up.
      - name: Work out the version
        id: ver
        shell: bash
        run: |
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo -n "1.0.${{ github.run_number }}" > version.txt
          cat version.txt

      - name: Build EXE
        run: |
          pyinstaller --onedir --noconsole --add-data "ui.html;." --add-data "extract.py;." --add-data "version.txt;." --add-data "fonts/Cairo.ttf;fonts" --collect-data escpos --name "KebzetZamen" receipt_server.py

      # Files the app loads at runtime (the UI, the Arabic font, python-escpos's
      # printer capabilities table) are data, not imports, so PyInstaller only
      # bundles them if it's told to -- and when one is missed the app builds
      # fine and then fails on the till instead. Fail the build here instead.
      # Checks the files actually shipped in dist/, wherever PyInstaller put
      # them (they live under _internal/ from PyInstaller 6 on).
      - name: Verify runtime resources are bundled
        run: |
          $app = 'dist/KebzetZamen'
          if (-not (Test-Path "$app/KebzetZamen.exe")) { throw "exe not built: $app/KebzetZamen.exe" }
          foreach ($f in @('ui.html', 'extract.py', 'version.txt', 'Cairo.ttf', 'capabilities.json')) {
            $hit = Get-ChildItem -Path $app -Recurse -Filter $f -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $hit) { throw "not bundled into the app folder: $f" }
            Write-Host "bundled: $($hit.FullName)"
          }

      # Inno Setup isn't on the runner image, so install it. It builds the
      # installer the app downloads and runs for its own updates.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: |
          # ${env:...} braces, not $env:...(x86) -- the parentheses in the
          # variable name don't parse in the bare form.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} installer.iss
          if (-not (Test-Path 'installer_out/KebzetZamenSetup.exe')) { throw "installer not produced" }

      # The zip stays published alongside the installer, for installing by
      # hand without running a setup program.
      - name: Zip the app folder
        run: Compress-Archive -Path dist/KebzetZamen -DestinationPath dist/KebzetZamen-Windows.zip -Force

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: KebzetZamen-Windows
          path: |
            installer_out/KebzetZamenSetup.exe
            dist/KebzetZamen

      # Publish to a rolling "latest" release so there is one permanent,
      # login-free download link that always points at the newest build:
      #   https://github.com/<owner>/<repo>/releases/latest/download/KebzetZamenSetup.exe
      #
      # The release NAME carries the version: the tag is the fixed string
      # "latest", so the app's update check reads the version from the name.
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KebzetZamen ${{ steps.ver.outputs.version }}
          files: |
            installer_out/KebzetZamenSetup.exe
            dist/KebzetZamen-Windows.zip

      # The release keeps assets that a build no longer uploads, so the old
      # single-file exe would sit there forever and the old download link
      # would keep handing out a build from before this change. Drop it --
      # a no-op on every run after the first.
      - name: Remove the stale single-file exe asset
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete-asset latest KebzetZamen.exe --yes || echo "no stale KebzetZamen.exe asset to remove"
