name: Build Windows EXE

"on":
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask pyinstaller pywebview pillow python-escpos

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --add-data "ui.html;." --add-data "extract.py;." --add-data "fonts/Cairo.ttf;fonts" --name "KebzetZamen" receipt_server.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KebzetZamen-Windows
          path: dist/KebzetZamen.exe

      # Publish the freshly built .exe to a rolling "latest" release so there
      # is one permanent, login-free download link that always points at the
      # newest build:
      #   https://github.com/<owner>/<repo>/releases/latest/download/KebzetZamen.exe
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: dist/KebzetZamen.exe
