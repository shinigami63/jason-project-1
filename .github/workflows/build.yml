name: Build Windows EXE

"on":
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flask pyinstaller pywebview

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --add-data "ui.html;." --add-data "extract.py;." --name "KebzetZamen" receipt_server.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KebzetZamen-Windows
          path: dist/KebzetZamen.exe
