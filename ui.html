<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kebbet Zamen — Receipt</title>
<style>
  :root { --red: #c62828; --bg: #f5f5f5; --card: #fff; --border: #e0e0e0; --text: #111; --muted: #888; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); min-height: 100vh; padding: 24px 16px; color: var(--text); }
  .wrap { max-width: 680px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 20px; }
  header h1 { font-size: 22px; font-weight: 800; flex: 1; }
  header h1 span { color: var(--red); }
  header p { font-size: 13px; color: var(--muted); }
  .settings-btn { background: none; border: 1.5px solid var(--border); border-radius: 7px; padding: 6px 10px; font-size: 16px; cursor: pointer; color: var(--muted); transition: all .15s; flex-shrink: 0; }
  .settings-btn:hover { border-color: #999; color: var(--text); }

  .paste-card { background: var(--card); border: 2px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .paste-card label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 8px; }
  textarea { width: 100%; height: 160px; padding: 10px; border: 1.5px solid var(--border); border-radius: 7px; font-size: 12px; font-family: monospace; resize: vertical; background: #fafafa; }
  textarea:focus { outline: none; border-color: var(--red); }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 22px; border: none; border-radius: 7px; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .1s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-parse { background: #111; color: #fff; margin-top: 10px; }
  .btn-print { background: var(--red); color: #fff; margin-top: 16px; width: 100%; justify-content: center; font-size: 15px; padding: 13px; }
  .btn-add { background: #e8f5e9; color: #2e7d32; border: 1.5px solid #a5d6a7; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 8px; width: 100%; }

  .status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .status.err { color: var(--red); }

  .meta-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; font-size: 13px; }
  .meta-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .meta-row:last-child { margin-bottom: 0; }
  .meta-label { color: var(--muted); font-size: 12px; min-width: 90px; }
  .badge { background: #e65100; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .edit-hint { font-size: 10px; color: #bbb; margin-bottom: 8px; text-align: right; }

  [contenteditable] { border-bottom: 1.5px dashed #ccc; min-width: 40px; outline: none; cursor: text; padding: 1px 2px; border-radius: 2px; }
  [contenteditable]:hover { border-bottom-color: #999; }
  [contenteditable]:focus { border-bottom-color: var(--red); background: #fff8f8; }
  .meta-value { font-weight: 700; font-size: 13px; }

  .items-section { display: none; }
  .item-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .qty-badge { background: #111; color: #fff; font-size: 15px; font-weight: 900; min-width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0 6px; cursor: text; }
  .item-info { flex: 1; min-width: 0; }
  .item-ar { font-size: 15px; font-weight: 700; direction: rtl; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  .item-en { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .comment-input { width: 150px; padding: 7px 9px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 12px; flex-shrink: 0; }
  .comment-input:focus { outline: none; border-color: var(--red); }
  .remove-btn { background: none; border: none; color: #ccc; font-size: 20px; cursor: pointer; flex-shrink: 0; line-height: 1; padding: 0 4px; }
  .remove-btn:hover { color: var(--red); }

  /* ── Settings overlay ──────────────────────────────────────────────────── */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; }
  .overlay.open { display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; overflow-y: auto; }
  .settings-panel { background: #fff; border-radius: 12px; width: 100%; max-width: 680px; padding: 24px; }
  .sp-header { display: flex; align-items: center; margin-bottom: 20px; }
  .sp-header h2 { font-size: 18px; font-weight: 800; flex: 1; }
  .sp-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }
  .sp-close:hover { color: var(--text); }

  .sp-section { margin-bottom: 24px; }
  .sp-section h3 { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }

  /* Branch selector */
  .branch-options { display: flex; gap: 10px; }
  .branch-opt { flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: 8px; background: #fafafa; cursor: pointer; text-align: center; font-size: 14px; font-weight: 700; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; direction: rtl; transition: all .15s; }
  .branch-opt:hover { border-color: #999; }
  .branch-opt.selected { border-color: var(--red); background: #fff8f8; color: var(--red); }

  /* Dictionary */
  .dict-search { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 7px; font-size: 13px; margin-bottom: 10px; }
  .dict-search:focus { outline: none; border-color: var(--red); }
  .dict-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .dict-table th { text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding: 6px 8px; border-bottom: 2px solid var(--border); }
  .dict-table th:last-child { width: 36px; }
  .dict-table td { padding: 5px 6px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  .dict-input { width: 100%; padding: 5px 7px; border: 1.5px solid transparent; border-radius: 5px; font-size: 13px; background: transparent; }
  .dict-input:focus { outline: none; border-color: var(--red); background: #fff8f8; }
  .dict-input.ar { direction: rtl; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  .dict-del { background: none; border: none; color: #ddd; font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .dict-del:hover { color: var(--red); background: #fff0f0; }
  .dict-add-row { display: flex; gap: 8px; margin-top: 10px; }
  .dict-add-row input { flex: 1; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 7px; font-size: 13px; }
  .dict-add-row input:focus { outline: none; border-color: var(--red); }
  .dict-add-row input.ar { direction: rtl; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  .btn-dict-add { background: #111; color: #fff; border: none; border-radius: 7px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-dict-add:hover { background: #333; }

  .sp-footer { display: flex; align-items: center; gap: 10px; padding-top: 16px; border-top: 1.5px solid var(--border); }
  .btn-save-settings { background: var(--red); color: #fff; border: none; border-radius: 7px; padding: 10px 24px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-save-settings:hover { opacity: .88; }
  .sp-save-status { font-size: 13px; color: var(--muted); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kebbet <span>Zamen</span></h1>
    <p>Receipt Generator</p>
    <button class="settings-btn" onclick="openSettings()" title="Settings">⚙️</button>
  </header>

  <div class="paste-card">
    <label>Paste Toters order page</label>
    <textarea id="rawText" placeholder="Copy the entire Toters order page and paste it here..."></textarea>
    <br>
    <button class="btn btn-parse" id="parseBtn" onclick="parseOrder()">Parse Order</button>
    <div class="status" id="status"></div>
  </div>

  <div class="items-section" id="itemsSection">
    <div class="edit-hint">✏️ Click any field to edit &nbsp;|&nbsp; ✕ to remove item</div>
    <div class="meta-card" id="metaCard"></div>
    <div id="itemsList"></div>
    <button class="btn-add" onclick="addItem()">+ Add Item</button>
    <button class="btn btn-print" id="printBtn" onclick="printReceipt()">🖨️ Print Receipt</button>
  </div>
</div>

<!-- Settings overlay -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="settings-panel">
    <div class="sp-header">
      <h2>⚙️ Settings</h2>
      <button class="sp-close" onclick="closeSettings()">✕</button>
    </div>

    <div class="sp-section">
      <h3>Branch</h3>
      <div class="branch-options" id="branchOptions">
        <div class="branch-opt" data-branch="الأشرفية" onclick="selectBranch(this)">الأشرفية</div>
        <div class="branch-opt" data-branch="الذوق" onclick="selectBranch(this)">الذوق</div>
        <div class="branch-opt" data-branch="dbayeh" onclick="selectBranch(this)">Dbayeh</div>
      </div>
    </div>

    <div class="sp-section">
      <h3>Dictionary</h3>
      <input class="dict-search" id="dictSearch" placeholder="Search items..." oninput="filterDict()">
      <table class="dict-table">
        <thead>
          <tr>
            <th>English (Toters)</th>
            <th>Arabic (Receipt)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="dictBody"></tbody>
      </table>
      <div class="dict-add-row">
        <input id="newEn" placeholder="english name" oninput="syncNewAr()">
        <input id="newAr" class="ar" placeholder="الاسم بالعربي">
        <button class="btn-dict-add" onclick="addDictRow()">+ Add</button>
      </div>
    </div>

    <div class="sp-footer">
      <button class="btn-save-settings" onclick="saveSettings()">Save Changes</button>
      <span class="sp-save-status" id="spStatus"></span>
    </div>
  </div>
</div>

<script>
let parsedOrder = null;
let itemCount = 0;
let dictData = {};
let settingsData = {};
let dictFilter = '';

// ── Main app ──────────────────────────────────────────────────────────────────
async function parseOrder() {
  const text = document.getElementById('rawText').value.trim();
  if (!text) return;
  const btn = document.getElementById('parseBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Processing...';
  status.className = 'status';
  status.textContent = 'Extracting and translating...';
  try {
    const res = await fetch('/parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (data.error) { status.className = 'status err'; status.textContent = '⚠ ' + data.error; return; }
    parsedOrder = data;
    renderUI(data);
    status.textContent = '';
  } catch (e) {
    status.className = 'status err';
    status.textContent = '⚠ Connection failed: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Parse Order';
  }
}

function renderUI(data) {
  const meta = document.getElementById('metaCard');
  const sched = data.scheduled ? '<div class="meta-row"><span class="badge">SCHEDULED</span></div>' : '';
  meta.innerHTML = `
    ${sched}
    <div class="meta-row"><span class="meta-label">Customer</span><span class="meta-value" contenteditable id="m-customer">${data.customer}</span></div>
    <div class="meta-row"><span class="meta-label">Prepare by</span><span class="meta-value" contenteditable id="m-prepare">${data.prepare_by}</span></div>
    <div class="meta-row"><span class="meta-label">Order #</span><span class="meta-value" contenteditable id="m-order">${data.order_num}</span></div>
  `;
  itemCount = 0;
  document.getElementById('itemsList').innerHTML = '';
  data.items.forEach(item => addItemRow(item));
  document.getElementById('itemsSection').style.display = 'block';
}

function addItemRow(item = null) {
  const i = itemCount++;
  const qty = item ? item.qty : '1';
  const ar  = item ? item.arabic_name : '';
  const en  = item ? item.name : '';
  const div = document.createElement('div');
  div.className = 'item-card';
  div.id = `item-${i}`;
  div.innerHTML = `
    <div class="qty-badge" contenteditable id="qty${i}">${qty}</div>
    <div class="item-info">
      <div class="item-ar" contenteditable id="ar${i}">${ar}</div>
      <div class="item-en" contenteditable id="en${i}">${en}</div>
    </div>
    <input type="text" class="comment-input" id="c${i}" placeholder="Kitchen note">
    <button class="remove-btn" onclick="removeItem(${i})" title="Remove">✕</button>
  `;
  document.getElementById('itemsList').appendChild(div);
}

function addItem() {
  addItemRow();
  document.getElementById('itemsList').lastElementChild.querySelector('[contenteditable]').focus();
}

function removeItem(i) {
  const el = document.getElementById(`item-${i}`);
  if (el) el.remove();
}

function get(id) {
  const el = document.getElementById(id);
  return el ? el.innerText.trim() : '';
}

async function printReceipt() {
  if (!parsedOrder) return;
  const items = [];
  document.querySelectorAll('.item-card').forEach(card => {
    const id = card.id.replace('item-', '');
    const qty = get(`qty${id}`);
    const ar  = get(`ar${id}`);
    if (!qty || !ar) return;
    items.push({ qty, arabic_name: ar, name: get(`en${id}`), comment: document.getElementById(`c${id}`)?.value.trim() || '' });
  });

  const payload = { ...parsedOrder, customer: get('m-customer'), prepare_by: get('m-prepare'), order_num: get('m-order'), items };
  autoLearnCorrections();
  const btn    = document.getElementById('printBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Printing...';

  try {
    const res  = await fetch('/receipt', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.ok) {
      status.className = 'status';
      status.textContent = '✅ Receipt printed!';
    } else {
      status.className = 'status err';
      status.textContent = '⚠ ' + (data.error || 'Print failed');
    }
  } catch (e) {
    status.className = 'status err';
    status.textContent = '⚠ Cannot reach printer: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🖨️ Print Receipt';
  }
}

function autoLearnCorrections() {
  if (!parsedOrder || !parsedOrder.items) return;
  const corrections = {};
  const originalItems = parsedOrder.items;
  document.querySelectorAll('.item-card').forEach(card => {
    const id = parseInt(card.id.replace('item-', ''));
    if (id >= originalItems.length) return;
    const original = originalItems[id];
    const currentAr = get(`ar${id}`);
    const currentEn = get(`en${id}`);
    if (!currentAr || currentAr === original.arabic_name) return;
    const key = currentEn.toLowerCase().trim();
    if (!key) return;
    corrections[key] = currentAr;
  });
  if (Object.keys(corrections).length === 0) return;
  fetch('/dictionary/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(corrections)
  }).catch(() => {});
}

// ── Settings panel ────────────────────────────────────────────────────────────
async function openSettings() {
  try {
    const [dr, sr] = await Promise.all([fetch('/dictionary'), fetch('/settings')]);
    dictData     = await dr.json();
    settingsData = await sr.json();
  } catch(e) {
    dictData     = {};
    settingsData = { branch: 'الأشرفية' };
  }
  renderBranch();
  renderDict();
  document.getElementById('spStatus').textContent = '';
  document.getElementById('overlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('overlay').classList.remove('open');
}

function overlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeSettings();
}

function selectBranch(el) {
  document.querySelectorAll('.branch-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  settingsData.branch = el.dataset.branch;
}

function renderBranch() {
  document.querySelectorAll('.branch-opt').forEach(o => {
    o.classList.toggle('selected', o.dataset.branch === settingsData.branch);
  });
}

function filterDict() {
  dictFilter = document.getElementById('dictSearch').value.toLowerCase();
  renderDict();
}

function renderDict() {
  const tbody = document.getElementById('dictBody');
  tbody.innerHTML = '';
  Object.entries(dictData)
    .filter(([k, v]) => !dictFilter || k.includes(dictFilter) || v.includes(dictFilter))
    .sort(([a], [b]) => a.localeCompare(b))
    .forEach(([en, ar]) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="dict-input" value="${escHtml(en)}" data-key="${escHtml(en)}" onchange="updateDictKey(this, '${escHtml(en)}')" onblur="updateDictKey(this, '${escHtml(en)}')"></td>
        <td><input class="dict-input ar" value="${escHtml(ar)}" data-en="${escHtml(en)}" onchange="updateDictVal(this)"></td>
        <td><button class="dict-del" onclick="deleteDictRow('${escHtml(en)}')">✕</button></td>
      `;
      tbody.appendChild(tr);
    });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateDictKey(input, oldKey) {
  const newKey = input.value.toLowerCase().trim();
  if (!newKey || newKey === oldKey) return;
  const val = dictData[oldKey];
  delete dictData[oldKey];
  dictData[newKey] = val;
  input.dataset.key = newKey;
  // update ar input's data-en
  const row = input.closest('tr');
  if (row) { const arInput = row.querySelector('.dict-input.ar'); if (arInput) arInput.dataset.en = newKey; }
}

function updateDictVal(input) {
  const en = input.dataset.en;
  if (en) dictData[en] = input.value.trim();
}

function deleteDictRow(en) {
  delete dictData[en];
  renderDict();
}

async function syncNewAr() {
  const en = document.getElementById('newEn').value.trim();
  const arInput = document.getElementById('newAr');
  if (!en || arInput.value) return;
  // Check local dict first
  const key = en.toLowerCase();
  if (dictData[key]) { arInput.value = dictData[key]; return; }
}

function addDictRow() {
  const en = document.getElementById('newEn').value.trim().toLowerCase();
  const ar = document.getElementById('newAr').value.trim();
  if (!en || !ar) return;
  dictData[en] = ar;
  document.getElementById('newEn').value = '';
  document.getElementById('newAr').value = '';
  document.getElementById('dictSearch').value = '';
  dictFilter = '';
  renderDict();
}

async function saveSettings() {
  const statusEl = document.getElementById('spStatus');
  statusEl.textContent = 'Saving...';
  try {
    const [dr, sr] = await Promise.all([
      fetch('/dictionary/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dictData) }),
      fetch('/settings/save',   { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(settingsData) })
    ]);
    const [dd, sd] = await Promise.all([dr.json(), sr.json()]);
    if (dd.ok && sd.ok) {
      statusEl.textContent = '✅ Saved!';
      setTimeout(() => { statusEl.textContent = ''; closeSettings(); }, 800);
    } else {
      statusEl.textContent = '⚠ Save failed';
    }
  } catch(e) {
    statusEl.textContent = '⚠ ' + e.message;
  }
}
</script>
</body>
</html>
